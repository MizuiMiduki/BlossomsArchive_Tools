  <style id="ba-tools-critical-css">
    html,body{width:100%;max-width:100%;height:100%;min-height:100dvh;overflow-x:hidden;margin:0;padding:0;background-color:#ffffff;color:#1f2937;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    @media(prefers-color-scheme:dark){html,body{background-color:#1d232a;color:#a6adbb}}
    html[data-theme='dark']{background-color:#1d232a;color:#a6adbb}
    html[data-theme='light']{background-color:#ffffff;color:#1f2937}
    #root{width:100%;max-width:100%;height:100%;min-height:100dvh;overflow-x:hidden}
  </style>
  <script>
    (function(){
      try {
        var p = new URLSearchParams(window.location.search).get('theme');
        var s = localStorage.getItem('theme');
        var m = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (p === 'dark' || (!p && (s === 'dark' || (!s && m)))) {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else if (p === 'light' || s === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch(e){}
    })();
  </script>
