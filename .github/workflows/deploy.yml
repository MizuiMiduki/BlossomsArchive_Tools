name: Build and Deploy to FTP

on:
    push:
        branches:
            - main
    workflow_dispatch:
        inputs:
            今回のみ待機時間チェックを省略:
                description: "選択すると、この実行に限り公開後の待機時間チェックを省略します"
                type: boolean
                required: false
                default: false
            サーバーを全削除して再デプロイ:
                description: "選択すると、サーバー上の全ファイルを削除してからアップロードします（通常は差分同期のため不要）"
                type: boolean
                required: false
                default: false

permissions:
    contents: read

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            # FTP_SERVER(ドメイン)をシークレット登録していても、接続エラー時などに
            # 名前解決後のIPアドレスがログへ出力されるため、解決結果をマスクする
            - name: Mask FTP Server IP Addresses
              env:
                  FTP_SERVER: ${{ secrets.FTP_SERVER }}
              run: |
                  # ftp:// 等のスキームやポート表記が付いていても、ホスト名のみを取り出す
                  HOST="${FTP_SERVER#*://}"
                  HOST="${HOST%%/*}"
                  HOST="${HOST%%:*}"
                  if [ -z "$HOST" ]; then
                    echo "::warning::FTP_SERVER が空のため IP マスクをスキップしました"
                    exit 0
                  fi
                  # IPv4 / IPv6 を含め、解決されるすべてのアドレスを登録する
                  for ADDR in $(getent ahosts "$HOST" | awk '{print $1}' | sort -u); do
                    echo "::add-mask::$ADDR"
                  done
                  # 直接IPが指定されている場合もマスクする
                  if echo "$HOST" | grep -Eq '^[0-9.]+$|^[0-9a-fA-F:]+$'; then
                    echo "::add-mask::$HOST"
                  fi

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: "24"
                  package-manager-cache: false

            - name: Install pnpm
              uses: pnpm/action-setup@v5

            - name: Install dependencies
              if: github.event_name != 'workflow_dispatch' || !inputs['今回のみ待機時間チェックを省略']
              run: pnpm install --frozen-lockfile

            - name: Install dependencies (temporary policy bypass)
              if: github.event_name == 'workflow_dispatch' && inputs['今回のみ待機時間チェックを省略']
              run: pnpm install --frozen-lockfile --config.minimum-release-age=0

            - name: Build
              env:
                  VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
                  VITE_ADSENSE_CLIENT_ID: ${{ secrets.VITE_ADSENSE_CLIENT_ID }}
                  VITE_ADSENSE_DEFAULT_SLOT: ${{ secrets.VITE_ADSENSE_DEFAULT_SLOT }}
              run: pnpm run build

            - name: Deploy via FTP
              uses: SamKirkland/FTP-Deploy-Action@v4.3.5
              with:
                  server: ${{ secrets.FTP_SERVER }}
                  username: ${{ secrets.FTP_USERNAME }}
                  password: ${{ secrets.FTP_PASSWORD }}
                  local-dir: "./dist/"
                  server-dir: "${{ secrets.FTP_TARGET_DIR }}"
                  dangerous-clean-slate: ${{ github.event_name == 'workflow_dispatch' && inputs['サーバーを全削除して再デプロイ'] || false }}
