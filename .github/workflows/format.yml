name: Format Code

on:
    pull_request:
        types: [opened, synchronize, reopened]
    workflow_dispatch:
        inputs:
            今回のみ待機時間チェックを省略:
                description: "選択すると、この実行に限り公開後の待機時間チェックを省略します"
                type: boolean
                required: false
                default: false

permissions:
    contents: write

jobs:
    format:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v5
              with:
                  ref: ${{ github.head_ref }}

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: "24"
                  package-manager-cache: false

            - name: Install pnpm
              uses: pnpm/action-setup@v5

            - name: Install dependencies
              if: github.event_name != 'workflow_dispatch' || !inputs['今回のみ待機時間チェックを省略']
              run: pnpm install --frozen-lockfile

            - name: Install dependencies (temporary policy bypass)
              if: github.event_name == 'workflow_dispatch' && inputs['今回のみ待機時間チェックを省略']
              run: pnpm install --frozen-lockfile --config.minimum-release-age=0

            - name: Determine changed files
              id: changed-files
              if: github.event_name == 'pull_request'
              run: |
                  FILES=$(git diff --name-only origin/${{ github.base_ref }}... | grep -E '\.(js|html|css|json)$' | tr '\n' ' ' || true)
                  echo "FILES=$FILES" >> $GITHUB_ENV

            - name: Format code
              if: github.event_name == 'pull_request' && env.FILES != ''
              run: npx prettier --write $FILES

            - name: Format all code (Manual)
              if: github.event_name == 'workflow_dispatch'
              run: npx prettier --write "**/*.{js,html,css,json}"

            - name: Commit formatted files
              if: github.event_name == 'pull_request' && env.FILES != ''
              run: |
                  git config --global user.name "github-actions[bot]"
                  git config --global user.email "github-actions[bot]@users.noreply.github.com"
                  git add $FILES
                  git commit -m "Apply Prettier formatting [skip ci]" || echo "No changes to commit"
                  git push
